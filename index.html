<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Roulette</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Anime Roulette</h1>
    <p class="subtitle">Draai en ontdek welk personage je krijgt</p>

    <div class="roulette-viewport">
      <div class="pointer-top"></div>
      <div class="center-line"></div>
      <div class="fade fade-left"></div>
      <div class="fade fade-right"></div>
      <div class="strip-track" id="strip-track"></div>
    </div>

    <div class="controls">
      <button id="spin-btn">DRAAIEN!</button>
      <div class="stats">
        <span>Spins: <b id="stat-spins">0</b></span>
        <span>Beste pull: <b id="stat-best">-</b></span>
      </div>
    </div>

    <div id="result" class="hidden">
      <h2 id="character-name">-</h2>
      <p id="character-rarity">-</p>
      <div id="character-stats">
        <p>Power: <span id="stat-power">0</span></p>
      </div>
    </div>

    <div class="history">
      <span class="history-label">Laatste pulls:</span>
      <div id="history-list" class="history-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
