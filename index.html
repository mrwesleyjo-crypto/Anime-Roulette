<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiverse Anime Toernooi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Multiverse Anime Toernooi</h1>
    <p class="subtitle">Scout vechters uit tientallen anime-universes, train ze, versla rivalen en klim door de liga's tot de Multiversum Finale — allemaal gestuurd door het lot van de roulette.</p>

    <div class="tier-ladder" id="tier-ladder"></div>

    <div class="points-bar-wrap">
      <div class="points-bar"><div class="points-fill" id="points-fill"></div></div>
      <span class="points-label" id="points-label">Bronzen Liga: 0 / 150 rangpunten</span>
    </div>

    <div class="roster-panel">
      <span class="roster-label">Jouw roster</span>
      <div class="roster-list" id="roster-list"></div>
    </div>

    <h3 class="roulette-title" id="roulette-title">Klaar om te beginnen?</h3>

    <div class="roulette-viewport">
      <div class="pointer-top"></div>
      <div class="center-line"></div>
      <div class="fade fade-left"></div>
      <div class="fade fade-right"></div>
      <div class="strip-track" id="strip-track"></div>
    </div>

    <button id="main-btn">Scout je eerste vechter!</button>

    <div id="event-panel" class="event-panel hidden"></div>

    <div class="log-panel">
      <span class="log-label">Toernooi Logboek</span>
      <div id="log-list" class="log-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
